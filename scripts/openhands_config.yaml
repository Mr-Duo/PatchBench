# Config for the OpenHands harness.
# api_key_name / auth_token_name are the NAMES of environment variables; the
# secrets themselves are read from the environment at runtime.
# Set at least one of them.

model_name: openrouter/anthropic/claude-haiku-5.5   # litellm model string; must have a MODEL_PRICING entry
base_url: https://openrouter.ai/api/v1               # null/omit for the provider default
api_key_name: OPENROUTER_API_KEY                     # env var -> LLM api_key
auth_token_name: null                                # env var -> "Authorization: Bearer <token>" header
effort_level: medium                                 # null/omit to not send reasoning_effort