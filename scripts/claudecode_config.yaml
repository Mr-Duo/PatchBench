# Config for the Claude Code harness.
# *_name fields are the NAMES of environment variables; the secret values are
# read from the environment at runtime and never stored in this file.

# --- OpenRouter example ---------------------------------------------------
base_url: https://openrouter.ai/api      # no /v1. Omit/null for Anthropic direct.
auth_token_name: OPENROUTER_API_KEY      # env var -> ANTHROPIC_AUTH_TOKEN
api_key_name: null                       # null -> ANTHROPIC_API_KEY is set to ""
model_name: anthropic/claude-haiku-5.5  # OpenRouter slug
effort_level: medium

# --- Anthropic direct example (swap in) -----------------------------------
